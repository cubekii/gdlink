name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          #- name: macOS
          #  os: macos-latest

          #- name: Android32
          #  os: ubuntu-latest
          #  target: Android32

          #- name: Android64
          #  os: ubuntu-latest
          #  target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    if: !startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    if: !startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: ./output

